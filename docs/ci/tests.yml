name: تست‌ها

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  bazyabi:
    name: تست ابزار بازیابی
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب shellcheck و poppler
        run: sudo apt-get update && sudo apt-get install -y shellcheck poppler-utils

      - name: بررسی ایستا (shellcheck)
        run: shellcheck -S warning tools/bazyabi/bazyabi.sh tools/bazyabi/lib/common.sh tools/bazyabi/tests/run_tests.sh

      - name: تست آفلاین با سرور ماک
        run: bash tools/bazyabi/tests/run_tests.sh

# ── توجه ─────────────────────────────────────────────────────────────
# این فایل عمداً بیرون از .github/workflows نگه داشته شده، چون توکن این
# نشست مجوز ساخت/به‌روزرسانی workflow را ندارد.
# برای فعال‌سازی CI کافی است خودتان اجرا کنید:
#   mkdir -p .github/workflows && cp docs/ci/tests.yml .github/workflows/tests.yml
